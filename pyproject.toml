[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "saans"
version = "0.1.0"
description = "A personal, Delhi-specific air-quality planner (CPCB NAQI)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-socket>=0.7",
  "pytest-cov>=5",
  "respx>=0.21",
]

[project.scripts]
saans = "saans.cli:main"

[tool.setuptools.packages.find]
include = ["saans*"]

[tool.setuptools.package-data]
saans = ["migrations/*.sql", "brief/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests must never touch the network (CLAUDE.md). respx mocks httpx at the transport layer.
addopts = "--disable-socket --allow-unix-socket -q"
